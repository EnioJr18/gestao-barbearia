services:
  postgres:
    image: postgres:17-alpine
    container_name: gestao_barbearia_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - gestao_barbearia_network

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao_barbearia_pgadmin
    profiles:
      - dev-tools

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - gestao_barbearia_network

    depends_on:
      postgres:
        condition: service_healthy

  back:
    build:
      context: ./back
      dockerfile: Dockerfile

    container_name: gestao_barbearia_back

    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      BACKUP_DIRECTORY: /app/backups
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

    networks:
      - gestao_barbearia_network

    volumes:
      - ./backups:/app/backups

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
    name: gestao_barbearia_postgres_data

  pgadmin_data:
    name: gestao_barbearia_pgadmin_data

networks:
  gestao_barbearia_network:
    name: gestao_barbearia_network
