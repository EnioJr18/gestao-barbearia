services:
  postgres:
    image: postgres:17-alpine
    container_name: gestao_barbearia_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - gestao_barbearia_network

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-barbeiro} -d ${POSTGRES_DB:-barbeiro_financeiro}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao_barbearia_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}

    profiles:
      - dev-tools

    ports:
      - '${PGADMIN_PORT:-5050}:80'

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - gestao_barbearia_network

    depends_on:
      postgres:
        condition: service_healthy

  back:
    build:
      context: ./back
      dockerfile: Dockerfile

    container_name: gestao_barbearia_back

    ports:
      - '${BACKEND_PORT:-8080}:8080'

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      BACKUP_DIRECTORY: /app/backups

    networks:
      - gestao_barbearia_network

    volumes:
      - ./backups:/app/backups

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: gestao_barbearia_postgres_data

  pgadmin_data:
    name: gestao_barbearia_pgadmin_data

networks:
  gestao_barbearia_network:
    name: gestao_barbearia_network
