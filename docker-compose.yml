services:

  postgres:
    image: postgres:16
    container_name: gestao_barbearia_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - gestao_barbearia_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao_barbearia_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - gestao_barbearia_network

    depends_on:
      postgres:
        condition: service_healthy


  back:
    build:
      context: ./back
      dockerfile: Dockerfile

    container_name: gestao_barbearia_back

    ports:
      - "${BACKEND_PORT}:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - gestao_barbearia_network

    depends_on:
      postgres:
        condition: service_healthy


volumes:

  postgres_data:
    name: gestao_barbearia_postgres_data

  pgadmin_data:
    name: gestao_barbearia_pgadmin_data


networks:

  gestao_barbearia_network:
    name: gestao_barbearia_network