name: Backend CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Testes, build e imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Tornar Gradle Wrapper executável
        run: chmod +x back/gradlew

      - name: Executar testes com Testcontainers
        working-directory: back
        run: ./gradlew clean test --no-daemon

      - name: Executar build
        working-directory: back
        run: ./gradlew clean build --no-daemon

      - name: Validar whitespace do diff
        run: git diff --check

      - name: Construir imagem do backend
        run: docker build --tag barbeiro-financeiro-back:ci ./back

      - name: Validar utilitários PostgreSQL na imagem
        run: docker run --rm --entrypoint sh barbeiro-financeiro-back:ci -c 'pg_dump --version && pg_restore --version'
